<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>
    <meta name="description" content="El Pollo Loco: a 2D jump-and-run browser game built with vanilla JavaScript and Canvas. Fight chickens, collect coins and bottles, and beat the boss." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="El Pollo Loco" />
    <meta property="og:description" content="A 2D jump-and-run browser game built with vanilla JavaScript and Canvas." />
    <meta property="og:url" content="https://pollo.weskakay.de/" />

    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="img/sombrero.png" />

    <!-- Base classes -->
    <script src="models/drawable-object.class.js"></script>
    <script src="models/moveable-object.class.js"></script>

    <!-- Managers / Input -->
    <script src="models/sound-manager.class.js"></script>
    <script src="models/keyboard.class.js"></script>

    <!-- Entities -->
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/endboss.class.js"></script>

    <!-- HUD -->
    <script src="models/status-bar.class.js"></script>
    <script src="models/status-bar-boss.class.js"></script>
    <script src="models/status-bar-bottle.class.js"></script>
    <script src="models/status-bar-coin.class.js"></script>

    <!-- Level -->
    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="levels/level2.js"></script>

    <!-- World -->
    <script src="models/world/world.class.js"></script>
    <script src="models/world/world.loop.js"></script>
    <script src="models/world/world.hud.js"></script>
    <script src="models/world/world.throw.js"></script>
    <script src="models/world/world.collectibles.js"></script>
    <script src="models/world/world.collisions.js"></script>
    <script src="models/world/world.endboss.js"></script>
    <script src="models/world/world.render.js"></script>

    <!-- Game bootstrap -->
    <script src="js/game.js" defer></script>
</head>

<body>
    <div id="stage">
        <canvas id="canvas" width="720" height="480" class="hidden-placeholder"></canvas>

        <div class="ui">
            <div id="start-screen" class="start-screen">
                <button onclick="startGame()">START</button>
            </div>

            <div id="loading-screen" class="loading-screen d-none">
                <div class="loading-box">
                    LOADING<span class="dots">.</span>
                </div>
            </div>

            <div id="help-screen" class="help-screen d-none">
                <button class="help-close" onclick="toggleHelp()">✕</button>
                <p><strong>CONTROL:</strong></p>
                <ul>
                    <li>➡️ / D – Move right</li>
                    <li>⬅️ / A – Move left</li>
                    <li>⬆️ / W – Jump</li>
                    <li>F – Throw bottle</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="game-controls">
        <button id="reset-btn" class="d-none" onclick="resetGame()"><span class="btn-icon">🔁</span><span class="btn-text"> RESET</span></button>
        <button id="music-btn" class="d-none" onclick="toggleMusic()"><span id="music-icon" class="btn-icon">🎵</span><span id="music-text" class="btn-text"> MUSIC: ON</span></button>
        <button id="help-btn" class="d-none" onclick="toggleHelp()"><span class="btn-icon">❔</span><span class="btn-text"> HELP</span></button>
    </div>

    <div id="mobile-controls" class="mobile-controls">
        <div class="mobile-left">
            <button id="btn-throw" class="mobile-btn mobile-throw">
                <img src="img/6_salsa_bottle/salsa_bottle.png" alt="throw">
            </button>
        </div>

        <div class="mobile-right">
            <div class="mobile-row">
                <button id="btn-jump" class="mobile-btn mobile-jump">⬆️</button>
            </div>

            <div class="mobile-row">
                <button id="btn-left" class="mobile-btn mobile-left-btn">⬅️</button>
                <button id="btn-right" class="mobile-btn mobile-right-btn">➡️</button>
            </div>
        </div>
    </div>

    <div id="rotate-overlay" class="rotate-overlay">
        <div class="rotate-box">
            <p>Bitte drehe dein Gerät ins Querformat 📱↻</p>
        </div>
    </div>

    <footer id="footer">
        <a href="./legalNotice.html">Legal Notice</a>
        <span class="sep">|</span>
        <a href="./privacyPolicy.html">Privacy Policy</a>
        <span class="sep">|</span>
        <a id="github-link" href="https://github.com/weskakay/el-pollo-loco" target="_blank" rel="noopener noreferrer">GitHub</a>
    </footer>
</body>
</html>
